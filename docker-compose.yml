services:
  backend:
    image: butterfly-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/bots.json:/app/bots.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3000/health', r =>
          process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bot-network

  frontend:
    image: butterfly-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      BUTTERFLY_BACKEND_URL: http://backend:3000
      BUTTERFLY_WS_URL: ws://backend:3000
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    networks:
      - bot-network
    stdin_open: true
    tty: true

networks:
  bot-network:
    driver: bridge
